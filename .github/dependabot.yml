version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Covers the `actions/*` refs in this repo's workflows, which are SHA-pinned
  # to a tagged release — the case GitHub documents Dependabot as handling.
  #
  # It does NOT cover `edgeorgie/eval-lab`. That pin is an UNTAGGED commit, and
  # per GitHub's own docs ("if the commit you use is not associated with any
  # tag, Dependabot will update the GitHub Actions to the latest commit"),
  # Dependabot has no version to resolve for it. Measured, not assumed:
  # Dependabot ran on this repo and opened bumps for checkout/setup-node/
  # upload-artifact and four npm deps, and zero for eval-lab, while eval-lab's
  # default branch had already moved past the pin. Bumping that one ref is a
  # manual, reviewed change until eval-lab publishes a tag carrying action.yml.
  #
  # What enforces the pins is `tests/action-pins.test.ts`, run by the `verify`
  # job in ci.yml, which is a REQUIRED status check on `main` alongside `eval`
  # (`required_status_checks.contexts == ["eval", "verify"]`, strict) — so an
  # unpinned ref cannot merge. That is the mechanism; this comment only
  # describes it.

    # Two majors are held back deliberately, not by neglect. `eslint-config-next`
    # bundles its own `typescript-eslint`, and that copy hard-refuses both of
    # them — observed in CI, not assumed:
    #
    #   typescript@7.x  -> "typescript-eslint does not support TS 7.0"
    #                      (eslint-config-next/node_modules/typescript-eslint)
    #   eslint@10.x     -> TypeError: Error while loading rule
    #                      'react/display-name': contextOrFilename.getFilename
    #                      is not a function
    #
    # Both fail the `lint` step of this repo's own `verify` script, so the bump
    # cannot merge while that dependency is in the tree. Tracking upstream:
    # https://github.com/typescript-eslint/typescript-eslint/issues/10940
    # Remove these two ignores once `eslint-config-next` ships a copy that
    # supports them; nothing else is pinned here.
    ignore:
      - dependency-name: typescript
        versions: [">=7"]
      - dependency-name: eslint
        versions: [">=10"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
