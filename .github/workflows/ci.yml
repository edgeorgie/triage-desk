name: CI

# This repo had NO workflow that ran its own test suite. `eval.yml` runs
# eval-lab against the triage heuristics and `triage.yml` runs the bot; neither
# invokes `npm test`. Branch protection requires exactly one check (`eval`), so
# every test under `tests/` — including the security tests covering untrusted
# issue text, the path guard, the keystore and the CSP — had never once run in
# CI and could not fail a pull request.
#
# `verify` IS a required status check on `main`, alongside `eval`
# (`required_status_checks.contexts == ["eval", "verify"]`, strict). It was
# deliberately introduced as non-required so the first runs could be observed
# green on real pull requests before a merge gate depended on them; that
# observation is done and the gate is in place, so a pull request that unpins an
# action ref, floats a container image or breaks a test can no longer merge.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # This job only reads the tree; it never pushes. Not persisting the
          # token keeps it out of .git/config for every later step.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Next generates the `LayoutProps`/`PageProps` types that files under
      # `app/` reference, so typegen must precede `tsc --noEmit` or the
      # typecheck dies on a missing name rather than a real type error.
      - run: npx next typegen
      # typecheck -> lint -> spec:check -> test -> build, as defined by the
      # repo's own `verify` script rather than restated here, so this workflow
      # cannot drift from what a developer runs locally.
      - run: npm run verify
