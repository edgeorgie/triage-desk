name: Eval (triage heuristic)

# Dogfoods edgeorgie/eval-lab (the candidate's own CLI + GitHub Action, PR #21) as a CI gate
# on triage-desk's own heuristic classification logic (lib/heuristic-triage.ts), via
# scripts/eval-adapter.mjs (--model exec). Runs on every PR to this repo so a change to the
# kind/priority heuristics that breaks an existing case fails CI before merge.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege, and load-bearing here rather than boilerplate: the `eval`
# job invokes an action from ANOTHER repository (edgeorgie/eval-lab), which per
# the comment on that step installs its own CLI at job start. Without this block
# the job ran on the repository-default GITHUB_TOKEN scope — write, on a repo
# whose default is read-write — handing a write token to third-party-shaped code
# on every pull request and every push to main. Pinning the SHA bounds WHICH
# code runs; only this bounds what that code can do. `contents: read` is all the
# job needs: it checks out, installs, runs the eval and uploads an artifact.
permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes, so the token does not need to be left
          # behind in .git/config where any later step (including the
          # third-party action below) could reuse it.
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run eval-lab against triage-desk's heuristic triage logic
        id: eval
        # Pinned to a commit SHA, not `@main`. `eval` is this repo's ONLY
        # required status check, and this step is what decides it — so with a
        # mutable ref, any push to eval-lab silently redefined triage-desk's
        # merge gate with zero diff here and no review in this repo. The tag
        # `v0.1.0` is not an option: it predates `action.yml` existing at all
        # (added in eval-lab #21, 2026-10-09), so `@v0.1.0` resolves to a tree
        # with no action to run.
        #
        # Bumping this is a MANUAL reviewed change. Dependabot does not cover
        # it: the pin is an untagged commit, which its docs describe as the
        # "track the latest commit" case rather than a version bump, and it was
        # observed opening PRs for the `actions/*` pins here while opening none
        # for eval-lab. Tag a release in eval-lab to change that.
        #
        # The pin bounds what this repo resolves, not everything that executes:
        # the pinned action installs its own CLI at job start, so eval-lab's own
        # supply chain is upstream's to harden.
        uses: edgeorgie/eval-lab@2ce08e791884cd9d65835b25da7f46831cd9a2ee # main as of 2026-10-11
        with:
          config: eval.config.json
          model: exec
          out: eval-run.json

      - name: Verify the eval actually ran and passed
        run: |
          if [ "${{ steps.eval.outputs.passed }}" != "true" ]; then
            echo "eval-lab reported a failure against triage-desk's heuristic triage cases."
            exit 1
          fi
          echo "Confirmed: eval-lab ran triage-desk's real heuristic triage logic and all cases passed."

      - name: Upload eval run artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-lab-run
          path: eval-run.json
          if-no-files-found: ignore
